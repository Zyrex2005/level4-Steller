name: Level 4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=-reference-types"

jobs:
  contracts:
    name: Smart Contracts (build + hardened test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run contract unit tests (with edge cases)
        run: cargo test --workspace --verbose

      - name: Install Stellar CLI
        run: |
          mkdir -p $HOME/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "Downloading Stellar CLI release binary..."
          RELEASE_URL=$(curl -s https://api.github.com/repos/stellar/stellar-cli/releases/latest | grep "browser_download_url.*x86_64-unknown-linux-gnu.tar.gz" | cut -d : -f 2,3 | tr -d '"' | tr -d ' ' | head -n 1)
          if [ -n "$RELEASE_URL" ]; then
            curl -sSL "$RELEASE_URL" -o stellar.tar.gz
            tar -xzf stellar.tar.gz -C $HOME/.cargo/bin/
            chmod +x $HOME/.cargo/bin/stellar || true
          fi
          if ! command -v stellar &> /dev/null; then
            cargo install --locked stellar-cli
          fi

      - name: Build contracts to WASM (release)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          stellar contract build

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/**/release/*.wasm

  api-service:
    name: API Relay & Feedback Service Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        run: npm ci

      - name: Verify API service syntax
        run: node -c index.js

      - name: Run API service unit tests
        run: npm test

  frontend:
    name: "Frontend CI (Step 7 - lint + test + build validation)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Step 7 Check 1 - Typecheck & Lint
        run: npm run lint

      - name: Step 7 Check 2 - Run Frontend Unit Tests
        run: npm test

      - name: Step 7 Check 3 - Build Production Bundle
        run: npm run build

      - name: Step 7 Check 4 - Performance & Bundle Budget Check
        run: |
          echo "Checking JavaScript bundle size limits..."
          test -d dist
          ls -lh dist/assets/

