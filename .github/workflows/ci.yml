name: Level 4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Smart Contracts (build + hardened test suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run contract unit tests (with edge cases)
        run: cargo test --workspace --verbose

      - name: Build contracts to WASM (release)
        run: |
          cargo build --target wasm32-unknown-unknown --release -p escrow-contract
          cargo build --target wasm32-unknown-unknown --release -p reputation-contract

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm

  api-service:
    name: API Relay & Feedback Service Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        run: npm ci

      - name: Verify API service syntax
        run: node -c index.js

      - name: Run API service unit tests
        run: npm test

  frontend:
    name: Frontend (lint + test + build + performance budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Performance & Bundle Budget Check
        run: |
          echo "Checking JavaScript bundle size limits..."
          test -d dist
          ls -lh dist/assets/
